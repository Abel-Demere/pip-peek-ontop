<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">PIP Peek On Top</title>
  <desc id="desc">A blue browser frame with a white pin and silver floating video player for optional always-on-top support. Transparent background and equal outer margins.</desc>
  <defs>
    <linearGradient id="blue" x1="70" y1="64" x2="372" y2="390" gradientUnits="userSpaceOnUse">
      <stop stop-color="#43B5FF"/>
      <stop offset="1" stop-color="#0874DF"/>
    </linearGradient>
    <linearGradient id="silver" x1="269" y1="274" x2="455" y2="458" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FAFAFA"/>
      <stop offset="1" stop-color="#C9C9C9"/>
    </linearGradient>
    <linearGradient id="play" x1="331" y1="328" x2="391" y2="399" gradientUnits="userSpaceOnUse">
      <stop stop-color="#159FFF"/>
      <stop offset="1" stop-color="#0068D9"/>
    </linearGradient>
  </defs>
  <!-- Square toolbar canvas with enlarged artwork and minimal outer padding. -->
  <g transform="translate(-32 -18.285714) scale(1 1.07142857)">
  <rect x="32" y="32" width="448" height="376" rx="76" fill="#171717"/>
  <rect x="52" y="52" width="408" height="336" rx="56" fill="url(#blue)"/>
  <!-- A restrained browser header and generous content rhythm. -->
  <path d="M52 112H460" stroke="#171717" stroke-width="12"/>
  <circle cx="386" cy="82" r="6" fill="#171717"/>
  <circle cx="408" cy="82" r="6" fill="#171717" opacity=".55"/>
  <circle cx="430" cy="82" r="6" fill="#171717" opacity=".25"/>
  <rect x="80" y="146" width="148" height="18" rx="9" fill="white" opacity=".95"/>
  <rect x="80" y="182" width="252" height="10" rx="5" fill="white" opacity=".55"/>
  <rect x="80" y="206" width="198" height="10" rx="5" fill="white" opacity=".35"/>
  <!-- Pin marks the optional on-top component. -->
  <g stroke="white" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"><path d="M110 246h66m-54 0v28l-16 22h74l-16-22v-28M143 296v35"/></g>
  <!-- The floating player interrupts the parent frame for a clear PiP silhouette. -->
  <g transform="translate(64 0)">
  <rect x="232" y="248" width="248" height="232" rx="60" fill="#171717"/>
  <rect x="250" y="266" width="212" height="196" rx="42" fill="url(#silver)"/>
  <rect x="251" y="267" width="210" height="194" rx="41" stroke="white" stroke-opacity=".65" stroke-width="2"/>
  <path d="M332 329C332 323.611 337.833 320.243 342.5 322.938L400.5 356.424C405.167 359.118 405.167 365.854 400.5 368.549L342.5 402.035C337.833 404.729 332 401.361 332 395.972V329Z" fill="url(#play)"/>
  </g>
  </g>
</svg>
